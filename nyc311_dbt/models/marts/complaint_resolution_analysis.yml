version: 2

models:
  - name: complaint_resolution_analysis
    description: "Closed complaints with resolution time and SLA-breach flag, based on 90th percentile per complaint type."
    columns:
      - name: unique_key
        tests:
          - unique
          - not_null

      - name: resolution_hours
        description: "Hours between created_date and closed_date."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true